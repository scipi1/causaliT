# =============================================================================
# SingleCausalLayer Template (SVFA Embeddings)
# =============================================================================
# Model: SingleCausalLayer
# Embedding: SVFA (Structure-Value Factorized Attention) for S and X
# Use for: Experiments requiring separate structure/value pathways
#
# SVFA separates embeddings into:
# - Structure component: variable identity (for attention computation)
# - Value component: actual values (for output computation)
#
# Key Features:
# - Single decoder architecture: S → X prediction
# - SVFA factorization for both S and X embeddings
# - Supports ANS (Attention Necessity Score) experiments
# - Optional attention_bypass for ablation studies
#
# For standard summation embeddings, use config_single_causal.yaml instead.
#
# Auto-populated fields (from dataset_metadata.json):
# - data.S_seq_len, data.X_seq_len, data.Y_seq_len
# - data.num_embeddings_S, data.num_embeddings_X
# - data.feature_indices.value, data.feature_indices.variable
#
# =============================================================================
# EXPERIMENT NAMING CONVENTION
# =============================================================================
# Format: <arch>_<SelfAttn>_<CrossAttn>_<dataset>_SVFA_[modifiers]
#
# Components:
#   arch      : single (this template)
#   SelfAttn  : SM (ScaledDotProduct), Lie (LieAttention), 
#               PhiSM (PhiSoftMax), Toeplitz (ToeplitzLieAttention)
#   CrossAttn : SM (ScaledDotProduct), CC (CausalCrossAttention), PhiSM (PhiSoftMax)
#   dataset   : scm1, scm2, scm3, scm6, scm7, etc.
#   SVFA      : REQUIRED for this template (indicates SVFA embeddings)
#   modifiers : (optional) antisym, gated, indep, hard, orthS
#
# Modifier meanings:
#   antisym : dag_parameterization_self = "antisymmetric"
#   gated   : dag_parameterization_self = "gated"
#   indep   : dag_parameterization_self = "independent"
#   hard    : use_hard_masks = true
#   orthS   : orthogonal frozen S embedding (default is learnable)
#
# Example folder names for this template:
#   experiments/single/scm6/single_SM_SM_scm6_SVFA/
#   experiments/single/scm6/single_Lie_SM_scm6_SVFA/
#   experiments/single/scm6/single_Toeplitz_SM_scm6_SVFA_antisym/
#
# To run:
#   python -m causaliT.cli train experiments/single/scm6/single_Lie_SM_scm6_SVFA/
# =============================================================================

experiment:
  # Model dimensions
  d_model_set: 24                        # Embedding dimension
  dec_layers: 1                          # Number of decoder layers
  n_heads: 1                             # Number of attention heads
  d_ff: ${experiment.d_model_set}        # Feedforward dimension (= d_model)
  d_qk: ${experiment.d_model_set}        # Query/key dimension (= d_model)
  dropout: 0.0                           # Dropout rate
  
  # Training hyperparameters
  lr: 0.001
  batch_size: 64
  max_epochs: 100
  
  # Attention types (options: ScaledDotProduct, LieAttention, PhiSoftMax, ToeplitzLieAttention)
  dec_self_attention_type: "ScaledDotProduct"
  dec_cross_attention_type: "ScaledDotProduct"


model:
  model_object: "SingleCausalLayer"
  
  # ANS: attention_bypass at top level for sweep compatibility
  # When true: replaces learned attention with uniform attention
  # This tests if embeddings + MLP alone can fit the data
  attention_bypass: false

  embed_dim:
    d_model_set: ${experiment.d_model_set}
    val_emb_hidden: ${experiment.d_model_set}
    var_emb_hidden: ${experiment.d_model_set}
  
  kwargs:
    model: ${model.model_object}
    
    # SVFA factorization mode
    factorization: "svfa"
    
    # =========================================================================
    # S EMBEDDING (Source/Intervention Variables) - SVFA
    # =========================================================================
    # DEFAULT: Learnable SVFA embedding for S
    # Note the `role` field which designates structure vs value components
    ds_embed_S:
      setting:
        d_model: ${model.embed_dim.d_model_set}
        sparse_grad: false
      modules:
        - idx: ${data.feature_indices.value}
          embed: "linear"
          label: "value"
          role: "value"
          kwargs:
            input_dim: 1
            embedding_dim: ${model.embed_dim.val_emb_hidden}
        - idx: ${data.feature_indices.variable}
          embed: "nn_embedding"
          label: "variable"
          role: "structure"
          kwargs:
            num_embeddings: ${data.num_embeddings_S}
            embedding_dim: ${model.embed_dim.var_emb_hidden}
            padding_idx: 0
            sparse: false
            max_norm: 1
        - idx: ${data.feature_indices.value}
          embed: "mask"
          label: "value_missing"
          kwargs: {}
    
    comps_embed_S: "svfa"
    
    # ALTERNATIVE: Orthogonal frozen embedding for S
    # Each S variable gets a fixed orthogonal embedding vector.
    # Uncomment below and comment out the learnable SVFA version above.
    # Also remove: comps_embed_S: "svfa"
    # -----------------------------------------------------------------
    # ds_embed_S:
    #   num_variables: ${data.S_seq_len}
    #   value_input_dim: 1
    #   value_idx: ${data.feature_indices.value}
    #   var_idx: ${data.feature_indices.variable}
    #   freeze: true
    # -----------------------------------------------------------------
    
    # =========================================================================
    # X EMBEDDING (Observed Variables) - SVFA
    # =========================================================================
    # SVFA embedding with role annotations
    ds_embed_X:
      setting:
        d_model: ${model.embed_dim.d_model_set}
        sparse_grad: false
      modules:
        - idx: ${data.feature_indices.value}
          embed: "linear"
          label: "value"
          role: "value"
          kwargs:
            input_dim: 1
            embedding_dim: ${model.embed_dim.val_emb_hidden}
        - idx: ${data.feature_indices.variable}
          embed: "nn_embedding"
          label: "variable"
          role: "structure"
          kwargs:
            num_embeddings: ${data.num_embeddings_X}
            embedding_dim: ${model.embed_dim.var_emb_hidden}
            padding_idx: 0
            sparse: ${model.kwargs.ds_embed_X.setting.sparse_grad}
            max_norm: 1
        - idx: ${data.feature_indices.value}
          embed: "mask"
          label: "value_missing"
          kwargs: {}
    
    comps_embed_X: "svfa"
    
    # =========================================================================
    # ATTENTION CONFIGURATION
    # =========================================================================
    dec_cross_attention_type: ${experiment.dec_cross_attention_type}
    dec_cross_mask_type: "Uniform"
    dec_self_attention_type: ${experiment.dec_self_attention_type}
    dec_self_mask_type: "Uniform"
    
    n_heads: ${experiment.n_heads}
    dec_causal_mask: false
    dec_layers: ${experiment.dec_layers}
    activation: "gelu"
    norm: "layer"
    use_final_norm: true
    device: "cuda"
    
    # =========================================================================
    # MODEL DIMENSIONS
    # =========================================================================
    out_dim: 1
    d_ff: ${experiment.d_ff}
    d_model: ${model.embed_dim.d_model_set}
    d_qk: ${experiment.d_qk}
    
    S_seq_len: ${data.S_seq_len}
    X_seq_len: ${data.X_seq_len}
    
    # =========================================================================
    # OUTPUT MLP HEAD
    # =========================================================================
    output_mlp_layers: 1               # 1 = linear (backward compat), 2 = MLP
    output_mlp_hidden: ${experiment.d_ff}
    output_mlp_activation: "relu"
    output_mlp_dropout: 0.0
    
    # =========================================================================
    # DROPOUT
    # =========================================================================
    dropout_emb: ${experiment.dropout}
    dropout_attn_out: ${experiment.dropout}
    dropout_ff: ${experiment.dropout}
    dec_cross_dropout_qkv: ${experiment.dropout}
    dec_cross_attention_dropout: ${experiment.dropout}
    dec_self_dropout_qkv: ${experiment.dropout}
    dec_self_attention_dropout: ${experiment.dropout}
    
    # =========================================================================
    # DAG PARAMETERIZATION
    # =========================================================================
    # Options: "independent", "antisymmetric", "gated", or null
    dag_parameterization_self: null
    dag_parameterization_cross: null
    
    # =========================================================================
    # SHARED STRUCTURE ACROSS LAYERS
    # =========================================================================
    # When True and dec_layers > 1, Q/K projections and inner attention
    # mechanism are shared across all decoder layers. This enforces a
    # consistent causal structure across layers while allowing each layer
    # to learn different value transformations for improved reconstruction.
    # Has no effect when dec_layers = 1.
    # See docs/SHARED_STRUCTURE.md for details.
    share_structure_across_layers: false


training:
  # =========================================================================
  # OPTIMIZER
  # =========================================================================
  optimizer: "adamw"
  lr: ${experiment.lr}
  weight_decay: 0.01
  use_scheduler: false
  
  # =========================================================================
  # LOSS
  # =========================================================================
  loss_fn: "mse"
  
  # =========================================================================
  # TRAINING LOOP
  # =========================================================================
  batch_size: ${experiment.batch_size}
  max_epochs: ${experiment.max_epochs}
  k_fold: 5
  seed: 42
  save_ckpt_every_n_epochs: 10
  
  # =========================================================================
  # REGULARIZATION - All defaults at 0.0 (pure baseline)
  # All metrics are always logged - no log_* flags needed
  # =========================================================================
  
  # DEPRECATED: Acyclicity (NOTEARS) — partial causal ordering prevents cycles by construction.
  kappa: 0.0
  
  # DEPRECATED: DAG Sparsity — L1 on phi edge probabilities. No longer used with SVFA attention.
  lambda_sparse: 0.0
  lambda_sparse_cross: 0.0
  
  # =========================================================================
  # UNIFIED SCORE SPARSITY REGULARIZATION
  # Combines L1 and entropy with mode selection and automatic fallback
  # =========================================================================
  # Weight for self-attention score sparsity
  lambda_self_score_sparse: 0.0
  # Weight for cross-attention score sparsity
  lambda_cross_score_sparse: 0.0
  # DEPRECATED: self_sparsity_regularizer / cross_sparsity_regularizer
  # Sparsity mode is now auto-detected from the attention module:
  #   - L1 (score_tensor_for_sparsity) for non-softmax attention (Toeplitz, Lie, CC)
  #   - Entropy fallback for softmax-based attention (ScaledDotProduct, PhiSoftMax)
  # These keys are ignored if present in old configs.
  # self_sparsity_regularizer: "l1"     # DEPRECATED — auto-detected
  # cross_sparsity_regularizer: "entropy"  # DEPRECATED — auto-detected
  
  # HSIC - encourages independence between residuals and parents
  # lambda_hsic_cross: Weight for S→X HSIC (cross-attention)
  # lambda_hsic_self: Weight for X→X HSIC (self-attention)
  # use_attention_weighted_hsic: If True, weight HSIC by attention scores
  # normalize_hsic_by_loss: Scales HSIC by |loss| to balance gradients
  lambda_hsic_cross: 0.0
  lambda_hsic_self: 0.0
  use_attention_weighted_hsic: false
  normalize_hsic_by_loss: false
  hsic_sigma: 1.0
  hsic_adaptive_bandwidth: false  # Use median heuristic for scale-invariant HSIC
  # Kernel for source variables in cross-attention HSIC
  # "rbf" (default) — Gaussian kernel, best for continuous S
  # "dirac" — Delta kernel, best for discrete S (categorical/few levels)
  hsic_kernel_source: "rbf"
  # HSIC estimator mode: "biased" (standard) or "normalized" (nHSIC, Ma et al. 2020)
  # "normalized" uses Tikhonov regularization to reduce noise floor at small batch sizes
  hsic_mode: "biased"
  nhsic_epsilon: 0.01            # Regularization strength for normalized HSIC
  
  # =========================================================================
  # HSIC ANNEALING
  # =========================================================================
  # When enabled, lambda_hsic_cross and lambda_hsic_self are annealed from
  # start values to end values over hsic_anneal_epochs.
  # 
  # For staged training: calibration sets start values, end defaults to 0.
  # For manual use: set start/end values explicitly.
  #
  # Default behavior (when not set):
  #   - hsic_lambda_cross_start defaults to lambda_hsic_cross
  #   - hsic_lambda_cross_end defaults to 0.0
  #   - hsic_lambda_self_start defaults to lambda_hsic_self  
  #   - hsic_lambda_self_end defaults to 0.0
  use_hsic_annealing: false
  hsic_anneal_epochs: null       # null = anneal over all epochs
  hsic_lambda_cross_start: null  # null = use lambda_hsic_cross
  hsic_lambda_cross_end: 0.0     # Final cross-attention HSIC weight
  hsic_lambda_self_start: null   # null = use lambda_hsic_self
  hsic_lambda_self_end: 0.0      # Final self-attention HSIC weight
  
  # DEPRECATED: Decisiveness — pushes phi edge probabilities away from 0.5.
  lambda_decisive: 0.0
  lambda_decisive_cross: 0.0
  lambda_tau: 0.0
  target_tau: 0.0
  
  # DEPRECATED: KL prior regularization on phi running averages.
  lambda_kl: 0.0
  adaptive_z_scaling: true
  
  # Gradient routing: HSIC updates θ_S only, recon updates θ_R only
  use_gradient_routing: false
  
  # =========================================================================
  # GROUP L1 REGULARIZATION (L2,1 norm on embedding columns)
  # =========================================================================
  # Encourages entire embedding dimensions to go to zero,
  # effectively reducing d_model and constraining model capacity.
  # Used for staged training calibration (balancing HSIC gradient signal).
  lambda_group_l1: 0.0
  
  # GROUP L1 ANNEALING
  # Start high to constrain capacity (forces structure learning via HSIC),
  # then decay to lambda_group_l1 to release capacity for reconstruction.
  # Schedule: [0, idle) = start_value; [idle, idle+transient) = linear decay; rest = lambda_group_l1
  # Set start_value to null to disable annealing (default).
  lambda_group_l1_anneal_start_value: null   # Initial high value (e.g., 0.5)
  lambda_group_l1_anneal_idle_epochs: 0      # Epochs to hold at start_value
  lambda_group_l1_anneal_transient_epochs: 0 # Epochs for linear decay to lambda_group_l1
  
  # =========================================================================
  # HARD MASKS
  # =========================================================================
  use_hard_masks: false
  hard_mask_files:
    dec_cross: "dec1_cross_att_mask.csv"
    dec_self: "dec1_self_att_mask.csv"

  # =========================================================================
  # ORACLE ATTENTION
  # =========================================================================
  # When true, the attention mechanism BYPASSES the QK^T computation entirely
  # and uses the hard mask itself as the attention score matrix applied to V.
  # The DAG alignment is given (oracle), so the model only learns embeddings,
  # value projections and FF/output components from the reconstruction loss.
  # Requires use_hard_masks: true and supported attention types
  # (currently ToeplitzAttention and CausalCrossAttention).
  use_oracle_attention: false

  # Wrong-DAG oracle (controlled SHD corruption of the hard masks).
  # See `causaliT.core.utils.corrupt_dag_masks` for full semantics.
  #
  # Activation rule:
  #   - hard_masks_corruption_seed in {null, 0}  → no corruption (ground truth)
  #   - cross_control_shd == self_control_shd == 0 → no corruption
  # Otherwise, exactly `cross_control_shd` entries of dec_cross and exactly
  # `self_control_shd` entries of dec_self (off-diagonal pool) are flipped 0↔1.
  # Cross uses RNG `seed`; self uses `seed + 1`, so the two SHD knobs are
  # independent. If shd > num_true_edges, the function falls back to "all
  # edges must be wrong" (every true edge removed; up to `shd - k_true` extra
  # non-edges turned ON, capped by the available non-edge pool).
  # The corrupted self mask may contain cycles — this is detected and logged.
  hard_masks_corruption_seed: null
  cross_control_shd: 0
  self_control_shd: 0
  # When True, corruption is constrained to one-for-one edge swaps so the
  # corrupted mask has the SAME number of edges as the ground truth.
  # Disentangles "wrong-edges" from "more-edges-to-mix" effects.
  # Notes:
  #   - Only even SHD values are achievable; odd requests are rounded DOWN.
  #   - Capped at 2 * min(k_true, n_non_edges) in the eligible pool.
  #   - Edge count is invariant: corrupted.sum() == ground_truth.sum().
  hard_masks_preserve_sparsity: false


# =============================================================================
# STAGED TRAINING
# =============================================================================
# Enable multi-stage training pipeline for robust causal structure learning:
# Stage 0 (Calibration):       Find λ_group for gradient balance
# Stage 1 (Causal Init):       Pre-train with high HSIC for structure initialization
# Stage 2 (Score Sparsity CV): Select λ_score via k-fold cross-validation
# Stage 3 (Main Training):     Standard training with calibrated regularization
#
# To run: python -m causaliT.cli calitrain --exp_id <experiment>
# =============================================================================
staged_training:
  # Master switches (all off by default for backward compatibility)
  use_calibration: false
  use_causal_init: false
  use_score_sparsity_cv: false
  
  # Stage 0: Calibration
  calibration_epochs: 10            # Epochs per calibration trial
  calibration_balance_threshold: 2.0  # Ratio threshold for "balanced" gradients
  calibration_lambda_group_range: [1.0e-5, 1.0e-1]  # Search range for λ_group
  calibration_max_iterations: 10    # Max binary search iterations
  
  # Stage 1: Causal Initialization
  # Pre-train with HSIC-dominated loss to initialize toward causal structure.
  # The model learns the causal mechanism before fitting pressure takes over.
  causal_init_epochs: 20            # Epochs for causal initialization
  causal_init_hsic_multiplier: 10.0 # λ_hsic_init = λ_hsic_base × multiplier
  causal_init_n_seeds: 1            # Number of seeds to try (best HSIC wins)
                                    # Higher values (5-10) find better init points
                                    # at the cost of proportionally more compute
  
  # Freeze output MLP head during causal init to prevent it from
  # compensating for incorrect structure via expressiveness.
  # Only relevant when output_mlp_layers > 1. Default: true.
  causal_init_freeze_output_mlp: true
  
  # Stage 2: Score Sparsity Cross-Validation
  # Select optimal λ_score (attention score LASSO regularization) via k-fold CV.
  # Uses the SAME lambda for both cross- and self-attention score sparsity.
  # Selection rule: "min_hsic" (causal models) or "min_recon" (baselines).
  # Both criteria are always reported in the summary for comparison.
  score_sparsity_lambda_candidates: [0.0, 0.001, 0.005, 0.01, 0.05, 0.1]
  score_sparsity_cv_folds: 5         # Number of CV folds
  score_sparsity_cv_epochs: 20       # Training epochs per fold (short runs)
  score_sparsity_selection_rule: "min_hsic"  # "min_hsic" or "min_recon"
  
  # Manual override for λ_group (skip calibration if already known)
  # Set to null to use calibration result or training.lambda_group_l1
  lambda_group_l1: null
  
  # =========================================================================
  # STAGED OUTPUT VALUES (populated automatically by staged_train)
  # =========================================================================
  # These are written during staged training and propagated to main training.
  # Leave as null - they will be populated automatically.
  lambda_hsic_cross_suggested: null  # λ_hsic_cross from calibration (Stage 0)
  lambda_hsic_self_suggested: null   # λ_hsic_self from calibration (Stage 0)
  calibration_checkpoint: null       # Path to calibration checkpoint (Stage 0)
  lambda_score_suggested: null       # λ_score from score sparsity CV (Stage 2)


# =========================================================================
# DATA
# =========================================================================
data:
  dataset: "scm1"           # Dataset name (folder in data/)
  filename_input: "ds.npz"  # Single file (used when train_file/test_file are null)
  
  # Pre-split train/test files (optional)
  # If both are specified and exist, they will be used INSTEAD of filename_input
  # Set both to null to use the single filename_input file
  train_file: "ds_train.npz" # e.g., "ds_train.npz" for holdout split datasets
  test_file: "ds_test.npz"   # e.g., "ds_test.npz" for holdout split datasets
  
  val_idx: ${data.feature_indices.value}
  test_ds_ixd: null
  max_data_size: null
  
  # Auto-populated from dataset_metadata.json
  S_seq_len: null
  X_seq_len: null
  Y_seq_len: null
  num_embeddings_S: null
  num_embeddings_X: null
  num_embeddings_Y: null
  num_embeddings_shared: null
  
  feature_indices:
    value: null
    variable: null


# =============================================================================
# EVALUATION
# =============================================================================
# Specify which evaluation functions to run after training.
# Empty list = run default evaluations for the model type.
#
# Available functions:
# - eval_train_metrics: Training curves and loss analysis
# - eval_attention_scores: DAG recovery metrics
# - eval_embed: Embedding evolution analysis
# - eval_interventions: Causal intervention tests (do-calculus)
# - eval_embedding_dag_correlation: Embedding-DAG correlation
# - eval_ans: ANS (Attention Necessity Score) analysis
# - fix_kfold_summary: Fix tensor strings in kfold_summary.json
# - enrich_kfold_summary: Add aggregated statistics
# =============================================================================

evaluation:
  functions: []


special:
  mode: []
