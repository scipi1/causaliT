# AttentionSelectorLayer Template
#
# Research question:
#   Can a single cross-attention block recover causal parent sets from
#   observational data when given the actual values of all candidate
#   parents (S and X) as keys?
#
# Architecture:
#   Q: X_blanked  (variable identity only)
#   K/V: [S_actual, X_actual]  (actual values of all variables)
#   Hard mask: diagonal of X-X sub-block zeroed (no self-loops)
#   No self-attention block.
#
# Attention type recommendation:
#   CausalCrossAttention (ReLU-Tanh):  non-normalized, can be zero → sparse
#   SigmoidCrossAttention:             bounded [0,1], can be near-zero → sparse
#   ScaledDotSoftmax:                  softmax, always dense → use only as baseline
#
# Suggested workflow:
#   1. Run with lambda_hsic=0, lambda_score_sparse=0 to verify reconstruction works.
#   2. Add score sparsity (lambda_score_sparse=0.01) to drive attention sparse.
#   3. Add HSIC (lambda_hsic=0.1) to drive independence between sources and residuals.
#   4. Enable gradient routing for cleaner structure optimization.

experiment:
  # ==========================================================================
  # AttentionSelectorLayer — SVFA reference configuration
  # Each key lists: the DEFAULT (the SVFA stack), the available OPTIONS, and
  # the reference when a value is taken from a study / derivation.
  # ==========================================================================
  d_model_set: 24
  n_heads: 1
  d_ff_mult: 2.0
  d_qk_mult: 1.0            # d_qk == d_model: required by remove_*_projection.
  d_ff: null
  d_qk: null
  dropout: 0.0

  lr: 0.001
  batch_size: 64
  max_epochs: 2

  # --- Attention types -----------------------------------------------------
  # attention_type      — S->X cross block.  DEFAULT "GatedCrossAttention".
  #                       Options: "GatedCrossAttention" (gated L0 cross),
  #                       "CausalCrossAttention" / "SigmoidCrossAttention"
  #                       (non-gated, near-sparse baselines), "ScaledDotSoftmax"
  #                       (dense softmax baseline only), "HardConcreteCrossAttention".
  # self_attention_type — direction-aware X->X self block.  DEFAULT
  #                       "GatedSelfAttention" (symmetric existence x
  #                       antisymmetric direction).  Options: "GatedSelfAttention",
  #                       "CommutatorSelfAttention" (unified GCA-style existence
  #                       gate).  null selects the cross-only vanilla arm.
  attention_type: "GatedCrossAttention"
  self_attention_type: "GatedSelfAttention"

  # --- Harmonized attention temperatures ------------------------------------
  # See docs/documentation/ATTENTION_TEMPERATURES.md for the full derivation.
  # All three are the CALCULATED operating points (omissible - shown for clarity).
  #   init_tau_cross/self: 0.5 = the Hard-Concrete existence-gate temperature.
  #     With the symmetric stretch below, kappa = 0.5*ln(1) = 0 (gate opens at
  #     logit 0) and saturates at kappa_1 = 0.5*ln(21) ~= 1.5223.
  #   init_gamma/init_zeta: -1.1 / 1.1 = SYMMETRIC stretch bounds (gamma < 0 <
  #     1 < zeta), which makes kappa = 0 independent of the temperature.
  #     Reference: Louizos et al., ICLR 2018 (Hard-Concrete L0 stretch).
  init_tau_cross: 0.5       # default 0.5 (calculated, ATTENTION_TEMPERATURES.md)
  init_tau_self: 0.5        # default 0.5 (calculated, ATTENTION_TEMPERATURES.md)
  init_gamma: -1.1          # default -1.1 (Louizos et al., ICLR 2018)
  init_zeta: 1.1            # default 1.1  (Louizos et al., ICLR 2018)
  # Direction-gate Binary-Concrete temperature of the self block.  DEFAULT 2/3.
  # Reference: Louizos et al., ICLR 2018 - places the 0.9-posterior point at
  # ln(9)*2/3 ~= 1.465, just below kappa_1, so DIRECTION commits slightly before
  # EXISTENCE saturates (ATTENTION_TEMPERATURES.md).
  dir_tau_self: 0.6666666667

  # Init-balancing offset on the S->X cross gate ONLY.  DEFAULT "auto" (the
  # MATCHED offset T = ln(e^(x-kappa) + 2), balancing the cross gate against the
  # direction-halved X->X self edge).  Options: "auto" (matched), 0.0 (off,
  # existence-level balance), or a pinned float (legacy ablation).  Resolved at
  # data-load time by query_norm.resolve_init_edge_offset; never enters F.
  # Reference: docs/experimental_elaborations/QUERY_FANIN_SCALE_BUDGET.md §7.2.
  init_edge_offset: "auto"

  # --- SVFA / embedding composition -----------------------------------------
  # shared_dag_across_heads — DEFAULT true: one (L_X, L_S+L_X) DAG score shared
  #   across all value heads (Sparse Value-Function Attention).  Option false:
  #   each head owns an independent score (no sharing; ablation).
  shared_dag_across_heads: true
  # comps_embed — DEFAULT "svfa": sub-modules split into value/structure roles
  #   and projected into H separate value heads.  Option "summation": all
  #   sub-modules summed into one d_model vector (standard baseline).
  comps_embed: "svfa"
  # use_gradient_routing — DEFAULT true (structural params updated by HSIC +
  #   sparsity, reconstruction params by MSE).  Always true for the SVFA stack.
  use_gradient_routing: true

  # --- Structural (Q/K stream) embedding scheme ------------------------------
  # struct_embedding_type — DEFAULT "orthogonal_fixed" (dense frozen rows
  #   spanning the full d_model space, mutually orthonormal and value-independent;
  #   the SVFA reference).  Options:
  #   "orthogonal_fixed"     — FixedOrthonormalEmbedding (frozen frame).
  #   "orthogonal_learnable" — OrthogonalMaskEmbedding (learnable disjoint blocks).
  #   "standard_learnable"   — ModularEmbedding (nn_embedding; baseline).
  # The value stream is unchanged in all cases.
  struct_embedding_type: "orthogonal_fixed"

  # --- Decoupled X query embedding -------------------------------------------
  # free_query_embedding — DEFAULT true: the X QUERY gets its own free identity
  #   embedding (FreeQueryEmbedding), decoupling "X_i as child" from "X_i as
  #   parent".  Option false: single shared embedding (baseline).  Classified
  #   STRUCTURAL by gradient routing.
  free_query_embedding: true
  # query_centroid_init — DEFAULT true: initialise the free X query at the
  #   centroid of the (projected) keys so every query reads all candidate
  #   parents uniformly at init.  Requires free_query_embedding=true.  Option
  #   false: no centroid init.  Motivation: the SELF_ATTENTION
  #   investigate_S3_X4_spurious_barrier study.
  query_centroid_init: true

  # --- The two front-door keys: query_norm and fanin_prior -------------------
  # See docs/experimental_elaborations/QUERY_NORM_CAPACITY_AND_FANIN_PRIOR.md.
  # Everything on the normalised-query path is DERIVED from these two and from
  # the node count N, by query_norm.resolve_query_norm at data-load time.
  # query_norm — DEFAULT true: the MASTER SWITCH.  It drives normalize_query,
  #   query_centroid_init (following free_query_embedding), query_norm_learnable,
  #   query_norm_init_scale and query_fanin_scale with the consistent set.
  #   Option false: standard attention (raw query, 1/sqrt(E) scale) — the
  #   ablation/baseline arm.
  query_norm: true
  # fanin_prior — DEFAULT null (disabled).  Option: an integer K* = a PRIOR on
  #   the in-degree in EDGES (requires query_norm: true and lambda_query_norm > 0).
  #   For random ER-k DAGs use er_indegree_quantile(n, degree, 0.95) (~10 for
  #   ER-4), NOT ``degree`` itself (QUERY_NORM_CAPACITY_AND_FANIN_PRIOR.md §3).
  fanin_prior: null

  # The single knob behind the F derivation: the edge posterior P(z>0) that a
  # CENTROID-initialised query gives EVERY candidate parent.  DEFAULT 0.9 - just
  # above the gate-saturation posterior p_sat = sigmoid(kappa_1) ~= 0.8209 so the
  # deterministic gate starts saturated (QUERY_FANIN_SCALE_BUDGET.md).  Options:
  # a probability in (0.5, 0.9]; higher = hotter scores = more init mass per edge.
  query_centroid_max_p: 0.9

  # Derived sentinels - do NOT set by hand.  resolve_query_norm /
  # resolve_query_fanin_scale overwrite these at data-load time from query_norm
  # and the node count N.  normalize_query mirrors query_norm; query_fanin_scale
  # (F^2 = N*x(p*)^2) is computed from N.  "auto" = derive.
  normalize_query: ${experiment.query_norm}
  query_fanin_scale: auto

  # Adaptive learnable per-node query-norm budget (derived by query_norm; still
  # active machinery - see causaliT/utils/query_norm.py).  Each child owns
  # M_i = exp(log_scale_i) scaling its unit query; the structural loss charges
  # lambda_query_norm * sum_i relu(M_i - query_norm_target)^2.  Defaults shown;
  # normally left to resolve_query_norm (init_scale=1.0, target=1.0).
  query_norm_learnable: false
  query_norm_init_scale: 1.0
  query_norm_target: 1.0

  # --- Node topology: heterogeneous (default) vs homogeneous nodes -----------
  # homogeneous_nodes — DEFAULT false (SPLIT): the S/X prior is kept; only the
  #   L_X variables are children.  Option true (HOMOGENEOUS): drop the prior,
  #   [S ; X] is one set of N nodes, each simultaneously a value-blanked query
  #   and an actual-value key/value, with ONE square (N, N) block built from
  #   self_attention_type.  In homogeneous mode attention_type is IGNORED and
  #   shared_query / shared_key MUST be false (raise ValueError otherwise).
  homogeneous_nodes: false

  # --- Geometric transitive correction (grandparent suppression) -------------
  # transitive_correction — DEFAULT false (opt-in).  Suppresses edges already
  #   explained by a mediator (j -> k -> i).  Requires an orthonormal key frame
  #   (orthogonal_fixed + remove_key_projection).  Reference:
  #   experiments/6_INVESTIGATIONS/HOMOGENEOUS/TRANSITIVE_CORRECTION.md.
  transitive_correction: false
  transitive_alpha: 0.5       # strength; 1.0 starts eating true edges
  transitive_delta: 0.5       # target COSINE on the negative side of threshold
  transitive_tnorm: min       # Goedel; "prod" deflates and barely fires
  transitive_margin: true     # relu(m - Pi): silent at the all-on init
  transitive_symmetric: true  # the existence part of the gate is symmetric

  # --- Remove the structural query & key projections (W_q / W_K) -------------
  # DEFAULT true for both (the SVFA stack reads Q/K straight from the
  # orthonormal identity embeddings, dropping W_q / W_K).  Requires d_qk ==
  # d_model (d_qk_mult: 1.0).  Option false: keep a learnable projection.
  # Motivation: the SELF_ATTENTION investigate_S3_X4_spurious_barrier study.
  remove_query_projection: true
  remove_key_projection: true

  # Shared structural query projection (W_q) across the S->X cross block and the
  # X->X self block.  SPLIT MODE ONLY.  DEFAULT false (each block owns an
  # independent W_q).  Option true: one shared W_q across both blocks.
  shared_query: false

  # --- Per-node value embedding & output head (DAGMA-style) ------------------
  # To enable the DAGMA-style per-node MLP value embedding, change the
  # ``embed`` field of the value module in ds_embed_S / ds_embed_X below from
  # "linear" to "mlp_per_node" and add the kwargs:
  #   hidden_dim: 32          # fixed, does NOT scale with node count
  #   num_variables: ${data.S_seq_len}   # or ${data.X_seq_len} for ds_embed_X
  #   dropout: 0.0            # optional dropout after the hidden activation
  # per_node_output — DEFAULT false (shared MLPHead).  Option true: replace the
  #   forecaster with a PerNodeMLPHead (one decoder MLP per variable).  Makes
  #   the structural attention the sole cross-node mixing point.
  per_node_output: false
  per_node_output_hidden: 32


model:




  model_object: "AttentionSelectorLayer"

  embed_dim:
    d_model_set: ${experiment.d_model_set}
    val_emb_hidden: ${experiment.d_model_set}
    var_emb_hidden: ${experiment.d_model_set}

  kwargs:
    model: ${model.model_object}

    # S embedding (actual values used as keys)
    ds_embed_S:
      setting:
        d_model: ${model.embed_dim.d_model_set}
        sparse_grad: false
      modules:
        - idx: ${data.feature_indices.value}
          embed: "linear"
          label: "value"
          role: "value"
          kwargs:
            input_dim: 1
            embedding_dim: ${model.embed_dim.val_emb_hidden}
        - idx: ${data.feature_indices.variable}
          embed: "nn_embedding"
          label: "variable"
          role: "structure"
          kwargs:
            num_embeddings: ${data.num_embeddings_S}
            embedding_dim: ${model.embed_dim.var_emb_hidden}
            padding_idx: 0
            sparse: false
            max_norm: 1
        - idx: ${data.feature_indices.value}
          embed: "mask"
          label: "value_missing"
          kwargs: {}

    comps_embed_S: ${experiment.comps_embed}

    # X embedding — SAME module used for both:
    #   queries (blanked: value=0, only variable identity)
    #   keys    (actual: value + variable identity)
    ds_embed_X:
      setting:
        d_model: ${model.embed_dim.d_model_set}
        sparse_grad: false
      modules:
        - idx: ${data.feature_indices.value}
          embed: "linear"
          label: "value"
          role: "value"
          kwargs:
            input_dim: 1
            embedding_dim: ${model.embed_dim.val_emb_hidden}
        - idx: ${data.feature_indices.variable}
          embed: "nn_embedding"
          label: "variable"
          role: "structure"
          kwargs:
            num_embeddings: ${data.num_embeddings_X}
            embedding_dim: ${model.embed_dim.var_emb_hidden}
            padding_idx: 0
            sparse: ${model.kwargs.ds_embed_X.setting.sparse_grad}
            max_norm: 1
        - idx: ${data.feature_indices.value}
          embed: "mask"
          label: "value_missing"
          kwargs: {}

    comps_embed_X: ${experiment.comps_embed}

    # Attention
    attention_type: ${experiment.attention_type}
    n_heads: ${experiment.n_heads}
    # Harmonized temperatures; see the experiment block for the derivation.
    init_tau_cross: ${experiment.init_tau_cross}
    init_tau_self: ${experiment.init_tau_self}
    init_gamma: ${experiment.init_gamma}
    init_zeta: ${experiment.init_zeta}
    shared_dag_across_heads: ${experiment.shared_dag_across_heads}


    # Structural embedding variant (Q/K stream); see experiment.struct_embedding_type.
    struct_embedding_type: ${experiment.struct_embedding_type}
    # Decoupled X query embedding (Q only); see experiment.free_query_embedding.
    free_query_embedding: ${experiment.free_query_embedding}
    # Initialise the free X query at the key centroid; see experiment.query_centroid_init.
    query_centroid_init: ${experiment.query_centroid_init}
    # Normalised-query path (structure gate only).  These two are DERIVED at
    # data-load time by query_norm.resolve_query_norm from experiment.query_norm
    # (the front-door switch) and the node count N - the user never sets them by
    # hand.  normalize_query is forced True by query_norm=true; query_fanin_scale
    # (F^2 = N*x(p*)^2) is computed from N.
    normalize_query: ${experiment.query_norm}
    query_fanin_scale: ${experiment.query_fanin_scale}
    # Adaptive learnable per-node query-norm budget; see experiment.query_norm_learnable.
    query_norm_learnable: ${experiment.query_norm_learnable}
    query_norm_init_scale: ${experiment.query_norm_init_scale}
    query_norm_target: ${experiment.query_norm_target}
    # Direction-aware X→X self-attention split; see experiment.self_attention_type.
    self_attention_type: ${experiment.self_attention_type}
    # Homogeneous node topology (square (N, N) posterior over [S ; X]);
    # see experiment.homogeneous_nodes.
    homogeneous_nodes: ${experiment.homogeneous_nodes}
    # Direction-gate temperature of the self block's antisymmetric term;
    # see experiment.dir_tau_self.
    dir_tau_self: ${experiment.dir_tau_self}
    # Init-balancing offset on the S->X cross gate; see experiment.init_edge_offset.
    init_edge_offset: ${experiment.init_edge_offset}

    # Shared structural query projection across cross/self blocks (split only);
    # see experiment.shared_query.
    shared_query: ${experiment.shared_query}
    # Remove the structural query & key projections (W_q / W_K);
    # see experiment.remove_query_projection etc.
    remove_query_projection: ${experiment.remove_query_projection}
    remove_key_projection: ${experiment.remove_key_projection}




    # Dropout


    dropout_emb: ${experiment.dropout}
    dropout_attn_out: ${experiment.dropout}
    dropout_ff: ${experiment.dropout}
    dropout_qkv: ${experiment.dropout}
    attention_dropout: ${experiment.dropout}

    # Architecture
    activation: "gelu"
    # "none" recommended: the shared post-attention LayerNorms are a
    # transformer leftover; with sigmoid gates they erase the gate-mass signal
    # and attenuate structural gradients by 1/sigma_i. "layer" still loads old
    # checkpoints unchanged.
    norm: "none"
    use_final_norm: false
    device: "cuda"

    # Dimensions
    out_dim: 1
    d_ff: ${experiment.d_ff}
    d_model: ${model.embed_dim.d_model_set}
    d_qk: ${experiment.d_qk}

    # Sequence lengths
    S_seq_len: ${data.S_seq_len}
    X_seq_len: ${data.X_seq_len}

    # Output MLP head
    output_mlp_layers: 1
    output_mlp_hidden: ${experiment.d_ff}
    output_mlp_activation: "relu"
    output_mlp_dropout: 0.0
    # Per-node output head (DAGMA-style); see experiment.per_node_output.
    per_node_output: ${experiment.per_node_output}
    per_node_output_hidden: ${experiment.per_node_output_hidden}


training:
  optimizer: "adamw"
  lr: ${experiment.lr}
  weight_decay: 0.01
  use_scheduler: false
  # optimizer_kwargs: {}             # extra kwargs for the recon optimizer ctor
                                      # (e.g. {momentum: 0.9, nesterov: true} for SGD)

  # --- Structural optimizer (only used with use_gradient_routing: true) ---
  # null = inherit the reconstruction setting above.  The kwargs default to {}
  # (NOT to optimizer_kwargs), so e.g. SGD momentum must be set explicitly here.
  structural_optimizer: null         # adamw, adam, sgd, adagrad, rmsprop
  structural_lr: null
  structural_weight_decay: null
  structural_optimizer_kwargs: {}    # e.g. {momentum: 0.9, nesterov: true}

  # --- Node-wise (per-query) winner-take-all structural update ---------------
  # Each structural step updates only the ``topk`` query nodes whose gradient
  # has the strongest SNR evidence (streaming-EMA t-statistic); all other
  # query rows and their optimizer state are reverted after the step, so any
  # optimizer above works unchanged.  Hard-coded strategy constants (see
  # causaliT/training/nodewise_update.py): selector=snr, EMA beta=0.95,
  # bias correction on, min SNR=1.0 (below the noise floor NO node updates
  # this step), epsilon-greedy off, M_i (query_norm_log_scale) tied to its
  # query row.  Diagnostics (selection histogram, max SNR, gate-fired
  # fraction) are always logged under struct/nodewise_* when enabled.
  # Requires use_gradient_routing: true and free query embeddings.
  nodewise_update:
    enabled: false             # master switch; off = current behaviour
    topk: 1                    # query nodes updated per structural step
    reset_every_stage: true    # clear the SNR statistics at every phase switch
                               # (reconstruct<->structure)

  # --- Centroid-commit query dynamics (quantized queries + evidence shadow) --
  # The query embedding weights hold COMMITTED key-subset centroids (the
  # discrete parent-set hypothesis; the forward posterior is piecewise
  # constant).  Per structural step, per-node shadows accumulate the leaked
  # gradient  shadow <- committed + leak*(shadow - committed) - eta * g  and a
  # node re-commits when its shadow's exact nearest-centroid projection
  # changes subset (on commit: weight <- centroid, shadow re-centred, commit
  # stats reset, M_i reset).  See causaliT/training/centroid_commit.py.
  # Requires free query embeddings; mutually exclusive with nodewise_update.
  centroid_commit:
    enabled: false             # master switch; off = current behaviour
    evidence_lr: 10.0          # eta; with |g| ~ 0.005-0.075 and inter-centroid
                               # distance ~0.2, 10 gives a cell crossing in
                               # ~20-50 consistent steps
    evidence_leak: 0.95        # beta: evidence half-life ~ 14 steps
    shadow_source: hsic        # hsic | structural (which loss feeds the shadow)
    reset_m_on_commit: one     # one | off : reset M_i to 1 on commit so the new
                               # hypothesis opens its gates

  loss_fn: "mse"
  lambda_recon: 1.0

  # --- Structural reconstruction mixing (convex mix on structural pathway) ---
  # Convex mix between HSIC and reconstruction on the STRUCTURAL loss (Q/K +
  # structural embeddings), mirroring SingleCausalForecaster:
  #   L_struct = (1 - alpha) * HSIC_reg + alpha * loss_recon
  #              + score_sparse + group_l1 + notears + l0
  # alpha = lambda_struct_recon in [0, 1]:
  #   * 0.0 → pure-HSIC structural stream (original behaviour, default).
  #   * >0  → re-inject a controlled dose of reconstruction signal into the
  #           structural params.  Motivated by: causal parents must also be
  #           predictive (aligns with fit-driven NOTEARS/DAG-GNN/GraN-DAG/DCDI).
  # Only meaningful with use_gradient_routing: true (otherwise reconstruction
  # already updates every parameter via the total loss).
  lambda_struct_recon: 0.0


  batch_size: ${experiment.batch_size}
  max_epochs: ${experiment.max_epochs}
  k_fold: 1
  seed: 42
  save_ckpt_every_n_epochs: 10

  # --- Score sparsity (L1 on attention weights) ---
  # Set >0 to encourage sparse attention (structure recovery).
  # Recommended range: 0.001 to 0.1.
  lambda_score_sparse: 0.0

  # --- HSIC regularization (unified over [S, X] source) ---
  # Minimizes HSIC(source_j, residual_i) for all (i,j) pairs.
  # Drives residuals towards independence from all candidate parents.
  # Correct parents: residuals ≈ noise → HSIC → 0.
  # Wrong parents (descendants/spurious): HSIC > 0 → penalized.
  # Recommended range: 0.01 to 1.0.
  lambda_hsic: 1.0
  hsic_sigma: 1.0
  hsic_adaptive_bandwidth: true
  hsic_kernel_source: "rbf"
  hsic_mode: "biased"
  nhsic_epsilon: 0.01

  # --- Descendant-excluding HSIC (self-attention block only) --------------
  # Under an ANM (X_i = f_i(PA_i) + e_i) the ideal residual r_i = e_i is
  # independent of every NON-descendant of i, but NECESSARILY dependent on
  #   * its DESCENDANTS  (X_j downstream of i is a function of e_i), and
  #   * X_i itself       (X_i contains e_i).
  # Averaging those pairs into the HSIC term means the TRUE DAG is NOT a
  # minimiser of the structural loss: the only way the optimiser can shrink a
  # descendant term is to stop having r_i = e_i, i.e. to regress X_i on its own
  # child — the classic "attends to descendants instead of parents" failure.
  # Excluding Desc(i) U {i} removes that bias and makes the objective
  # consistent.  The exclusion set is read off the LEARNED directed posterior
  # (thresholded + transitive closure) and is always DETACHED, so the model can
  # never create an edge just to delete its own penalty term.
  #
  # Only applies to the SELF-attention columns: cross-attention keys are
  # exogenous S nodes, which can never be descendants of an X node.
  # Requires self_attention_type: GatedSelfAttention (a DIRECTED posterior is
  # needed to tell descendants from ancestors); otherwise it is disabled.
  #
  # CAUTION — self-confirmation risk: the mask comes from the adjacency that the
  # masked HSIC is itself training.  Early on the graph is ~random, so masking
  # can delete exactly the parent signal you are trying to find and lock in a
  # wrong orientation.  Use warmup / threshold / weight / hops to temper it.
  #
  # Suggested experiment ladder (safest -> strongest):
  #   hops=1,    weight=0.5, warmup=10   ->  hops=1, weight=0.0
  #   -> hops=null (full closure), weight=0.0
  hsic_exclude_descendants: false      # master switch (false = legacy behaviour)
  hsic_descendant_threshold: 0.5       # p_directed above which an edge is "present"
  hsic_descendant_hops: null           # null = full transitive closure; 1 = direct children only
  hsic_descendant_exclude_self: true   # also drop the equally-biased HSIC(X_i, r_i) diagonal
  hsic_descendant_weight: 0.0          # weight GIVEN TO excluded pairs (0 = drop; >0 = soft down-weight)
  hsic_descendant_warmup_epochs: 0     # no masking for the first N epochs of STRUCTURE
                                       # learning (the graph is still ~random, so masking
                                       # would delete the parent signal itself).  Counted
                                       # from run start under the plain/staged trainers;
                                       # under the ADAPTIVE trainer it is counted from the
                                       # first epoch of the FIRST structure phase and is
                                       # then served once (never re-paid per cycle).

  hsic_descendant_min_kept_frac: 0.25  # collapse guard: if a dense graph would mask more
                                       # than this, fall back to unmasked HSIC for the step
                                       # (otherwise the structural gradient dies silently)
  hsic_descendant_ema: 0.0             # EMA on the adjacency in [0,1) to stop mask thrashing
  # Logged diagnostics: {stage}_hsic_desc_kept_frac, {stage}_hsic_desc_cyclic.
  # NOTE: with masking ON, {stage}_hsic is a MASKED mean whose normalisation set
  # drifts across epochs, so it is not comparable epoch-to-epoch.  Prefer
  # kept_frac for health monitoring, and keep this in mind for
  # ``adaptive_training.hsic_monitor`` and the lambda calibration search.

  # --- Group-L1 (embedding column sparsity) ---
  lambda_group_l1: 0.0

  # --- L0 regularization (HardConcreteCrossAttention only) ---
  # Expected number of active edges = sum P(z_ij > 0).  Set >0 to encourage
  # sparse hard-concrete gates.  Ignored for non-HardConcrete attention types.
  lambda_l0: 0.0

  # --- Query-norm over-spend penalty (learnable per-node budget) ---
  # Weight on ``sum_i relu(M_i - query_norm_target)^2`` (see
  # experiment.query_norm_learnable and causaliT/utils/query_norm.py).  Charged
  # on the STRUCTURAL loss only.  0.0 lets each budget grow unpenalised; a small
  # positive value keeps M_i near the target unless the structural signal pays
  # for over-spending.  Ignored when query_norm_learnable=false.
  #
  # With ``experiment.fanin_prior`` set, this is the PRICE OF THE PRIOR and must
  # be positive (a zero weight makes the prior inert, so the resolver raises).
  # It is NOT derivable and does NOT transfer across n_keys unless the capacity
  # penalty form is used - keep it an explicit axis of every experiment.
  lambda_query_norm: 0.0
  # STRUCTURE epochs over which the fan-in squeeze walks K(t): n_keys -> K*
  # (linear in EDGES, so the schedule is interpretable).  Counted from the first
  # structure phase, never from the global epoch - under adaptive training the
  # long reconstruct phases would otherwise consume the whole window.
  #   auto (default) - n_keys - K*, i.e. one edge per structure epoch
  #   0              - immediate squeeze (the ablation: expect DEFLATED rows,
  #                    since re-concentrating the budget needs gradient steps)
  # Ignored when fanin_prior is null.
  fanin_anneal_epochs: auto


  # --- L0 <-> HSIC gradient-interference diagnostic ---
  # When True AND attention_type == "HardConcreteCrossAttention" AND
  # lambda_l0 > 0 AND lambda_hsic > 0, log the per-structural-block cosine
  # similarity between the L0 gradient and the HSIC gradient.  Metrics are
  # emitted to the CSV logger as ``train_interf_cos_<block>`` for blocks:
  #   query_projection, key_projection, embedding_S, embedding_X,
  #   query_embedding_X, attention_internals   (plus ``train_interf_cos_overall``).
  #   cos ~ +1 -> aligned;  cos ~ 0 -> orthogonal;  cos ~ -1 -> conflict.
  # The probe uses autograd.grad(retain_graph=True) and never writes .grad,
  # so it does NOT perturb training.  It runs on the first batch of every
  # ``interference_log_every_n_epochs`` epochs to keep the overhead low.
  log_l0_hsic_interference: false
  interference_log_every_n_epochs: 1

  # --- Gradient routing ---
  # When True: structural params (Q, K) updated by HSIC + sparsity;
  #            reconstruction params (V, output, FFN) updated by MSE.
  # Requires lambda_hsic > 0 or lambda_score_sparse > 0 to be meaningful.
  use_gradient_routing: ${experiment.use_gradient_routing}

  # Oracle mode: bypass QK^T, use hard mask directly as attention weights.
  # Useful as an upper-bound reconstruction baseline.
  use_oracle_attention: false


# ---------------------------------------------------------------------------
# ANM staged training (cross-fit / bilevel data splits)
# ---------------------------------------------------------------------------
# Consumed by ``anm_alternating_trainer`` (causaliT.training.anm_staged_trainer)
# when this config is run via the ANM entry point.  A standard single-run
# trainer ignores this block, so it is safe to keep in the template.
#
# Cross-fit rationale (Double ML / DARTS style "honesty"):
#   The reconstruction map f and the causal structure are trained on DISJOINT
#   subsets of the training data.  The residual-independence signal (HSIC) that
#   drives structure learning is only a valid independence test if residuals are
#   OUT-OF-SAMPLE w.r.t. the reconstruction fit — otherwise f can memorise the
#   very samples used to judge independence and bias edge scores toward false
#   independence.  ``data_split_ratio`` sets the fraction assigned to the
#   ``recon`` subset (the rest go to ``struct``); validation stays shared.
#
# Per-stage key ``data_split``:  "recon" | "struct" | "full"
#   recon  — reconstruction-warmup stage trains on the recon subset.
#   struct — structure stage trains (and measures HSIC) on the held-out subset.
#   full   — (default) use the entire training set = classic joint behaviour.
anm_training:
  starting_checkpoint: null      # optional warm-start before stage 0
  data_split_ratio: 0.5          # fraction of train samples in the "recon" subset

  stages:
    # Stage 1 — RECON WARMUP: freeze structure (Q/K + gates), fit only V/FFN/MLP
    #           on the recon subset.
    - name: recon_warmup
      max_epochs: ${experiment.max_epochs}
      lambda_hsic: 0.0
      lambda_recon: 1.0
      freeze_structural_params: true
      freeze_reconstruction_params: false
      data_split: recon
      eval_every_n_epochs: 0
      eval_dag: true
      evaluation:
        functions: []

    # Stage 2 — STRUCTURAL LEARNING: freeze reconstruction, let HSIC drive the
    #           structure on the held-out "struct" subset (out-of-sample residuals).
    - name: struct_phase
      max_epochs: ${experiment.max_epochs}
      lambda_hsic: 1.0
      lambda_recon: 0.0
      freeze_structural_params: false
      freeze_reconstruction_params: true
      data_split: struct
      eval_every_n_epochs: 0
      eval_dag: true
      evaluation:
        functions:
          - eval_train_metrics
          - eval_attention_selector_scores


# ---------------------------------------------------------------------------
# Consumed by ``adaptive_trainer`` (causaliT.training.adaptive_trainer) when
# this config is run via the ``adaptivetrain`` CLI entry point.  Unlike
# ``anm_training`` (fixed per-stage epoch budgets, disk-chained checkpoints),
# this runs a SINGLE in-memory pl.Trainer.fit() and switches between two
# mutually-exclusive phases automatically by monitoring a metric:
#
#   * reconstruct — train reconstruction params only (structure frozen);
#                   re-adapt the predictor to the current structure.
#                   Stops on a validation-metric plateau or an epoch cap.
#   * structure   — train structural params only (reconstruction frozen);
#                   keep learning structure against a frozen good predictor.
#                   Stops when the monitored metric degrades past a threshold
#                   (default +20% over the per-phase best) or an epoch cap.
#
# Requires ``training.use_gradient_routing: true`` (true requires_grad freeze).
adaptive_training:
  total_epoch_budget: 800          # global cap = pl.Trainer max_epochs
  start_phase: reconstruct         # warm up the predictor before structure
  max_cycles: null                 # OPTIONAL safety cap on structure phases
                                   # (null = unbounded; total_epoch_budget is
                                   # the real budget)

  starting_checkpoint: null        # optional warm-start (weights only)
  reset_optimizer_state_on_switch: false
  monitor: val_x_mae               # metric driving both phase triggers
  eval_dag: true                   # capture DAG diagnostics at each switch
  # Cross-fitting (DML/DARTS honest split): fraction of the training set given
  # to the reconstruct phase; the disjoint remainder is used by the structure
  # phase so residual-HSIC is measured out-of-sample w.r.t. the reconstruction
  # fit.  null (or a value outside the open interval (0, 1)) disables it and
  # both phases train on the full training set (default behaviour).
  data_split_ratio: null
  # Exchange the recon/structure subsets after EACH completed recon+structure
  # cycle (recon_1 on split A, struct_1 on B, recon_2 on B, struct_2 on A, ...).
  # Within every recon->struct pairing the subsets stay disjoint, so the honesty
  # property above is preserved while each sample serves both roles across the
  # run.  Requires data_split_ratio; ignored (with a warning) when it is null.
  swap_splits: false


  reconstruct:
    max_epochs: 100                # per-phase safety cap
    min_epochs: 0                  # floor: no plateau early-exit before N epochs
                                   # (applies to every reconstruct phase)
    warmup_min_epochs: 0           # larger floor for the INITIAL warmup phase
                                   # (falls back to min_epochs when unset)
    plateau_patience: 5            # stop after N val epochs w/o rel. improvement
    plateau_min_delta: 1.0e-4      # relative improvement threshold


  structure:
    max_epochs: 200                # per-phase safety cap
    lambda_hsic_cross: 1.0         # translated → lambda_hsic for AttentionSelectorLayer
    lambda_hsic_self: 0.0
    drop_pct: 0.20                 # switch when monitor rises 20% over phase best
    drop_patience: 5
    # HSIC-plateau early switch: watch the structural signal (``hsic_monitor``,
    # lower is better) and switch back to reconstruct when it stops improving,
    # freeing budget for an earlier reconstruction update instead of wasting
    # epochs on a stalled HSIC.  Reason precedence at the switch is:
    #   struct_drop (predictor stale) > struct_hsic_plateau > struct_budget (cap).
    hsic_monitor: val_hsic         # structural signal watched (e.g. val_hsic / train_hsic)
    hsic_patience: 0               # switch after N val epochs w/o HSIC improvement
                                   # (0 = disabled; no behaviour change)
    hsic_min_delta: 1.0e-4         # relative HSIC improvement threshold
    min_epochs: 0                  # floor: suppress BOTH structure early-exits
                                   # (struct_drop AND struct_hsic_plateau) before N
                                   # epochs — guards against early structure-learning
                                   # latency (the max_epochs cap always takes precedence)

    # --- Descendant-excluding HSIC, PER PHASE (optional) ---
    # Any of the ``training.hsic_descendant_*`` / ``hsic_exclude_descendants``
    # keys may be repeated here (and under ``reconstruct:``) to override the
    # ``training:``-level value while that phase is active.  Keys that are OMITTED
    # are left untouched, so this block is a pure no-op by default.
    #
    # This is the RECOMMENDED curriculum lever for the feature.  The mask is read
    # off the very adjacency the masked HSIC is training, so enabling it while the
    # graph is still ~random risks deleting the parent signal and locking in a
    # wrong orientation.  The adaptive schedule fixes that far better than a raw
    # epoch count: the first structure phase(s) run unmasked, and the mask is
    # switched on only once the predictor and adjacency have co-adapted.
    # ``hsic_descendant_warmup_epochs`` is anchored to the FIRST structure phase:
    # the controller counts it from that phase's first epoch (NOT from the start
    # of the run — the reconstruct warmup would otherwise expire it before a
    # single structural step had run) and marks it served afterwards, so later
    # structure phases start masked immediately instead of re-paying the delay.
    # Keep it comfortably below ``min_epochs`` if you want the FIRST phase itself
    # to train under the mask, since an HSIC-plateau exit can end that phase as
    # soon as the floor clears.

    #
    # Example — enable the safest variant during the structure phase only:
    #   hsic_exclude_descendants: true
    #   hsic_descendant_hops: 1        # direct children only
    #   hsic_descendant_weight: 0.5    # soft down-weight rather than a hard drop
    # The EMA state is reset at every phase switch, so a phase change never
    # inherits an adjacency smoothed under different settings.




data:
  dataset: "scm1_continuous"
  filename_input: "ds.npz"

  train_file: "ds_train.npz"
  test_file: "ds_test.npz"

  val_idx: ${data.feature_indices.value}
  test_ds_ixd: null
  max_data_size: null

  S_seq_len: null
  X_seq_len: null
  Y_seq_len: null
  num_embeddings_S: null
  num_embeddings_X: null
  num_embeddings_Y: null
  num_embeddings_shared: null

  feature_indices:
    value: null
    variable: null


evaluation:
  dag_threshold: 0.5
  functions:
    - "eval_train_metrics"
    - "eval_attention_selector_scores"

special:
  mode: []
