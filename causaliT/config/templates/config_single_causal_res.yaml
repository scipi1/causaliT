# =============================================================================
# SingleCausalLayerRes Template (SVFA Dual-Residual)
# =============================================================================
# Model: SingleCausalLayerRes
# Embedding: SVFA (Structure-Value Factorized Attention) for S and X
# Decoder: Dual-residual variant of the SVFA decoder
#          (residual connections on BOTH X_struct AND X_val)
#
# Difference vs config_single_causal_svfa.yaml:
#   - In standard SVFA, residual connections live ONLY on the value path:
#     X_val ← X_val + Attn(...).      X_struct passes through unchanged.
#   - In this dual-residual variant, BOTH streams accumulate updates:
#     X_struct ← X_struct + Attn_struct(...)
#     X_val    ← X_val    + Attn_val(...)
#     and the FFN sub-block also has residuals on both streams.
#
# Why a separate template?
#   - The dual-residual decoder requires the inner attention modules to be
#     built with `dual_value=True` (separate value/out projections for the
#     structural pathway). This is automatically injected by
#     SingleCausalLayerRes (see causaliT/core/architectures/single_causal_res/
#     model.py), so no extra knob needs to be exposed in the config — using
#     `model_object: "SingleCausalLayerRes"` is enough.
#   - `factorization` is forced to "svfa" by the model. It is kept here for
#     readability; setting it to anything else raises a ValueError.
#   - `attention_bypass` is NOT supported by SingleCausalLayerRes (the
#     bypass formulation assumes a single residual stream on X_val). Use
#     config_single_causal_svfa.yaml + SingleCausalLayer for ANS bypass.
#
# Use for: experiments where the structural stream (DAG hypothesis) should
#          be refined by the attention layer instead of being purely fed
#          forward from the embeddings.
#
# Auto-populated fields (from dataset_metadata.json):
# - data.S_seq_len, data.X_seq_len, data.Y_seq_len
# - data.num_embeddings_S, data.num_embeddings_X
# - data.feature_indices.value, data.feature_indices.variable
#
# =============================================================================
# EXPERIMENT NAMING CONVENTION
# =============================================================================
# Format: single_<SelfAttn>_<CrossAttn>_<dataset>_SVFA_RES_[modifiers]
#
#   SVFA_RES : REQUIRED for this template (indicates dual-residual SVFA)
#
# Example:
#   experiments/single/scm6/single_Lie_SM_scm6_SVFA_RES/
# =============================================================================

experiment:
  # Model dimensions
  d_model_set: 24                        # Embedding dimension
  dec_layers: 1                          # Number of decoder layers
  n_heads: 1                             # Number of attention heads
  d_ff: ${experiment.d_model_set}        # Feedforward dimension (= d_model)
  d_qk: ${experiment.d_model_set}        # Query/key dimension (= d_model)
  dropout: 0.0                           # Dropout rate

  # Training hyperparameters
  lr: 0.001
  batch_size: 64
  max_epochs: 100

  # Attention types (options: ScaledDotProduct, LieAttention, PhiSoftMax, ToeplitzLieAttention)
  dec_self_attention_type: "ScaledDotProduct"
  dec_cross_attention_type: "ScaledDotProduct"


model:
  model_object: "SingleCausalLayerRes"

  # NOT SUPPORTED for SingleCausalLayerRes — keep at false. Setting true
  # raises NotImplementedError. Use SingleCausalLayer for ANS experiments.
  attention_bypass: false

  embed_dim:
    d_model_set: ${experiment.d_model_set}
    val_emb_hidden: ${experiment.d_model_set}
    var_emb_hidden: ${experiment.d_model_set}

  kwargs:
    model: ${model.model_object}

    # Dual-residual decoder is SVFA-only by construction.
    factorization: "svfa"

    # =========================================================================
    # S EMBEDDING (Source/Intervention Variables) - SVFA
    # =========================================================================
    ds_embed_S:
      setting:
        d_model: ${model.embed_dim.d_model_set}
        sparse_grad: false
      modules:
        - idx: ${data.feature_indices.value}
          embed: "linear"
          label: "value"
          role: "value"
          kwargs:
            input_dim: 1
            embedding_dim: ${model.embed_dim.val_emb_hidden}
        - idx: ${data.feature_indices.variable}
          embed: "nn_embedding"
          label: "variable"
          role: "structure"
          kwargs:
            num_embeddings: ${data.num_embeddings_S}
            embedding_dim: ${model.embed_dim.var_emb_hidden}
            padding_idx: 0
            sparse: false
            max_norm: 1
        - idx: ${data.feature_indices.value}
          embed: "mask"
          label: "value_missing"
          kwargs: {}

    comps_embed_S: "svfa"

    # =========================================================================
    # X EMBEDDING (Observed Variables) - SVFA
    # =========================================================================
    ds_embed_X:
      setting:
        d_model: ${model.embed_dim.d_model_set}
        sparse_grad: false
      modules:
        - idx: ${data.feature_indices.value}
          embed: "linear"
          label: "value"
          role: "value"
          kwargs:
            input_dim: 1
            embedding_dim: ${model.embed_dim.val_emb_hidden}
        - idx: ${data.feature_indices.variable}
          embed: "nn_embedding"
          label: "variable"
          role: "structure"
          kwargs:
            num_embeddings: ${data.num_embeddings_X}
            embedding_dim: ${model.embed_dim.var_emb_hidden}
            padding_idx: 0
            sparse: ${model.kwargs.ds_embed_X.setting.sparse_grad}
            max_norm: 1
        - idx: ${data.feature_indices.value}
          embed: "mask"
          label: "value_missing"
          kwargs: {}

    comps_embed_X: "svfa"

    # =========================================================================
    # ATTENTION CONFIGURATION
    # =========================================================================
    # Note: dual_value=True is automatically injected into every attention
    # layer by SingleCausalLayerRes — no flag needs to be set here.
    dec_cross_attention_type: ${experiment.dec_cross_attention_type}
    dec_cross_mask_type: "Uniform"
    dec_self_attention_type: ${experiment.dec_self_attention_type}
    dec_self_mask_type: "Uniform"

    n_heads: ${experiment.n_heads}
    dec_causal_mask: false
    dec_layers: ${experiment.dec_layers}
    activation: "gelu"
    norm: "layer"
    use_final_norm: true
    device: "cuda"

    # =========================================================================
    # MODEL DIMENSIONS
    # =========================================================================
    out_dim: 1
    d_ff: ${experiment.d_ff}
    d_model: ${model.embed_dim.d_model_set}
    d_qk: ${experiment.d_qk}

    S_seq_len: ${data.S_seq_len}
    X_seq_len: ${data.X_seq_len}

    # =========================================================================
    # OUTPUT MLP HEAD
    # =========================================================================
    output_mlp_layers: 1               # 1 = linear (backward compat), 2 = MLP
    output_mlp_hidden: ${experiment.d_ff}
    output_mlp_activation: "relu"
    output_mlp_dropout: 0.0

    # =========================================================================
    # DROPOUT
    # =========================================================================
    dropout_emb: ${experiment.dropout}
    dropout_attn_out: ${experiment.dropout}
    dropout_ff: ${experiment.dropout}
    dec_cross_dropout_qkv: ${experiment.dropout}
    dec_cross_attention_dropout: ${experiment.dropout}
    dec_self_dropout_qkv: ${experiment.dropout}
    dec_self_attention_dropout: ${experiment.dropout}

    # =========================================================================
    # DAG PARAMETERIZATION
    # =========================================================================
    dag_parameterization_self: null
    dag_parameterization_cross: null

    # =========================================================================
    # SHARED STRUCTURE ACROSS LAYERS
    # =========================================================================
    share_structure_across_layers: false


training:
  # =========================================================================
  # OPTIMIZER
  # =========================================================================
  optimizer: "adamw"
  lr: ${experiment.lr}
  weight_decay: 0.01
  use_scheduler: false

  # =========================================================================
  # LOSS
  # =========================================================================
  loss_fn: "mse"

  # =========================================================================
  # TRAINING LOOP
  # =========================================================================
  batch_size: ${experiment.batch_size}
  max_epochs: ${experiment.max_epochs}
  k_fold: 5
  seed: 42
  save_ckpt_every_n_epochs: 10

  # =========================================================================
  # REGULARIZATION - All defaults at 0.0 (pure baseline)
  # =========================================================================
  kappa: 0.0
  lambda_sparse: 0.0
  lambda_sparse_cross: 0.0

  # Score sparsity
  lambda_self_score_sparse: 0.0
  lambda_cross_score_sparse: 0.0

  # HSIC
  lambda_hsic_cross: 0.0
  lambda_hsic_self: 0.0
  use_attention_weighted_hsic: false
  normalize_hsic_by_loss: false
  hsic_sigma: 1.0
  hsic_adaptive_bandwidth: false
  hsic_kernel_source: "rbf"
  hsic_mode: "biased"
  nhsic_epsilon: 0.01

  # HSIC annealing
  use_hsic_annealing: false
  hsic_anneal_epochs: null
  hsic_lambda_cross_start: null
  hsic_lambda_cross_end: 0.0
  hsic_lambda_self_start: null
  hsic_lambda_self_end: 0.0

  # Decisiveness / KL (DEPRECATED — kept for compatibility)
  lambda_decisive: 0.0
  lambda_decisive_cross: 0.0
  lambda_tau: 0.0
  target_tau: 0.0
  lambda_kl: 0.0
  adaptive_z_scaling: true

  # Gradient routing: HSIC updates θ_S only, recon updates θ_R only.
  # NOTE: with the dual-residual decoder, structural-path parameters now
  # include the per-layer struct value/out projections; STRUCTURAL_PATTERNS
  # in causaliT/training/gradient_routing.py has been updated to match.
  use_gradient_routing: false

  # Group L1
  lambda_group_l1: 0.0
  lambda_group_l1_anneal_start_value: null
  lambda_group_l1_anneal_idle_epochs: 0
  lambda_group_l1_anneal_transient_epochs: 0

  # =========================================================================
  # HARD MASKS
  # =========================================================================
  use_hard_masks: false
  hard_mask_files:
    dec_cross: "dec1_cross_att_mask.csv"
    dec_self: "dec1_self_att_mask.csv"

  use_oracle_attention: false
  hard_masks_corruption_seed: null
  cross_control_shd: 0
  self_control_shd: 0
  hard_masks_preserve_sparsity: false


# =============================================================================
# STAGED TRAINING (same defaults as the SVFA template)
# =============================================================================
staged_training:
  use_calibration: false
  use_causal_init: false
  use_score_sparsity_cv: false

  calibration_epochs: 10
  calibration_balance_threshold: 2.0
  calibration_lambda_group_range: [1.0e-5, 1.0e-1]
  calibration_max_iterations: 10

  causal_init_epochs: 20
  causal_init_hsic_multiplier: 10.0
  causal_init_n_seeds: 1
  causal_init_freeze_output_mlp: true

  score_sparsity_lambda_candidates: [0.0, 0.001, 0.005, 0.01, 0.05, 0.1]
  score_sparsity_cv_folds: 5
  score_sparsity_cv_epochs: 20
  score_sparsity_selection_rule: "min_hsic"

  lambda_group_l1: null

  lambda_hsic_cross_suggested: null
  lambda_hsic_self_suggested: null
  calibration_checkpoint: null
  lambda_score_suggested: null


# =========================================================================
# DATA
# =========================================================================
data:
  dataset: "scm1"
  filename_input: "ds.npz"

  train_file: "ds_train.npz"
  test_file: "ds_test.npz"

  val_idx: ${data.feature_indices.value}
  test_ds_ixd: null
  max_data_size: null

  S_seq_len: null
  X_seq_len: null
  Y_seq_len: null
  num_embeddings_S: null
  num_embeddings_X: null
  num_embeddings_Y: null
  num_embeddings_shared: null

  feature_indices:
    value: null
    variable: null


# =============================================================================
# EVALUATION
# =============================================================================
evaluation:
  functions: []


special:
  mode: []
