# =============================================================================
# Joint Sparsity Sweep Configuration (λ_self × λ_cross)
# =============================================================================
#
# Purpose: Find optimal sparsity regularization for edge selection.
# Both self-attention (X→X) and cross-attention (S→X) sparsity are swept
# jointly to prevent compensation effects.
#
# Output: Lasso-style plot showing edge count vs λ vs test loss
#
# Selection Criterion:
#   λ* = min{λ : |edges(λ)| = min AND test_loss(λ) < test_loss(0) + 0.05*std}
#
# Usage:
#   python -m causaliT.euler_sweep.euler_sweep.cli sweep \
#       --exp_id <your_exp_id> \
#       --sweep_mode combination
#
# Total combinations: 25 λ pairs × 3 seeds = 75 runs per dataset
# =============================================================================

# Sparsity regularization weights (L1 on attention scores)
training:
  lambda_self_score_sparse: [0.0, 0.01, 0.05, 0.1, 0.5]
  lambda_cross_score_sparse: [0.0, 0.01, 0.05, 0.1, 0.5]
  seed: [0, 1, 2]
  
  # Fix regularizer type (L1 for Toeplitz, entropy fallback for others)
  self_sparsity_regularizer: "l1"
  cross_sparsity_regularizer: "l1"
