# =============================================================================
# HSIC Regularization Sweep Configuration
# =============================================================================
#
# Purpose: Find safe HSIC regularization strength that:
# 1. Improves causal structure learning (lower SHD)
# 2. Doesn't destabilize training
#
# HSIC regularizes to encourage independence between:
# - S and residuals (cross-attention): S ⊥ (X - X̂)
# - X and per-variable residuals (self-attention): X_i ⊥ (X_j - X̂_j)
#
# Stability Criterion:
#   λ_hsic_max = max{λ : std(train_loss[-10:]) / mean(train_loss[-10:]) < 0.1}
#
# Usage:
#   python -m causaliT.euler_sweep.euler_sweep.cli sweep \
#       --exp_id <your_exp_id> \
#       --sweep_mode combination
#
# Total combinations: 15 λ pairs × 3 seeds = 45 runs per dataset
# =============================================================================

# HSIC regularization weights
training:
  lambda_hsic_cross: [0.0, 0.01, 0.1, 0.5, 1.0]
  lambda_hsic_self: [0.0, 0.01, 0.1]
  seed: [0, 1, 2]
  
  # HSIC kernel bandwidth (usually 1.0 works well)
  hsic_sigma: 1.0
  hsic_adaptive_bandwidth: false  # Use median heuristic for scale-invariant HSIC
  
  # Attention-weighted HSIC (weight residuals by attention strength)
  use_attention_weighted_hsic: false
